    <text x="0" y="62" font-size="14" font-weight="700" fill="#38E1FF" letter-spacing="2">PLANTAS DE EMERGENCIA DIÉSEL GRUPEL</text>
    <text x="0" y="80" font-size="12" font-weight="500" fill="#94a3b8">Comparativa Dimensional y Escalas Reales (Datos Oficiales de Ficha Técnica)</text>
